<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  fill="none"
  aria-hidden="true"
  focusable="false">

<defs>
  <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D9DCE9"/>
    <stop offset="12%" stop-color="#666B82"/>
    <stop offset="32%" stop-color="#171823"/>
    <stop offset="55%" stop-color="#07080D"/>
    <stop offset="77%" stop-color="#262839"/>
    <stop offset="100%" stop-color="#B8BCCB"/>
  </linearGradient>

  <linearGradient id="violetMetal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F0D8FF"/>
    <stop offset="18%" stop-color="#A85AFF"/>
    <stop offset="48%" stop-color="#5B2AD7"/>
    <stop offset="74%" stop-color="#24113D"/>
    <stop offset="100%" stop-color="#D768FF"/>
  </linearGradient>

  <linearGradient id="crimsonGem" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFD6E0"/>
    <stop offset="14%" stop-color="#F04C72"/>
    <stop offset="44%" stop-color="#A80F34"/>
    <stop offset="75%" stop-color="#4E0717"/>
    <stop offset="100%" stop-color="#E51F52"/>
  </linearGradient>

  <linearGradient id="fireGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#7A101A"/>
    <stop offset="25%" stop-color="#D52A1C"/>
    <stop offset="51%" stop-color="#FF641F"/>
    <stop offset="73%" stop-color="#FFB52D"/>
    <stop offset="91%" stop-color="#FFE772"/>
    <stop offset="100%" stop-color="#FFF2B8"/>
  </linearGradient>

  <linearGradient id="redBlack" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FF5367"/>
    <stop offset="28%" stop-color="#C91331"/>
    <stop offset="58%" stop-color="#460811"/>
    <stop offset="100%" stop-color="#08080C"/>
  </linearGradient>

  <linearGradient id="prestigeBone" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFF7E8"/>
    <stop offset="28%" stop-color="#E5D7C2"/>
    <stop offset="54%" stop-color="#A99275"/>
    <stop offset="78%" stop-color="#5E5043"/>
    <stop offset="100%" stop-color="#EEE3D2"/>
  </linearGradient>

  <linearGradient id="cyanViolet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#65E8FF"/>
    <stop offset="33%" stop-color="#3E8BFF"/>
    <stop offset="63%" stop-color="#6A49FF"/>
    <stop offset="100%" stop-color="#BD5CFF"/>
  </linearGradient>

  <radialGradient id="violetAura" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#8A52FF" stop-opacity=".34"/>
    <stop offset="60%" stop-color="#6729C9" stop-opacity=".14"/>
    <stop offset="100%" stop-color="#421A8A" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="redAura" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FF385D" stop-opacity=".32"/>
    <stop offset="62%" stop-color="#A40E2B" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#5C0617" stop-opacity="0"/>
  </radialGradient>

  <filter id="glow4" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow8" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<style>

.aura{animation:auraPulse 7.4s ease-in-out infinite}
.energyRing{filter:url(#glow4);animation:ringPulse 5.6s ease-in-out infinite}
.crack{stroke-dasharray:14 60;animation:crackSpark 9s ease-in-out infinite}
.fissure{stroke-dasharray:20 50;animation:fissureRun 7.6s ease-in-out infinite}
.bladeSpark{stroke-dasharray:22 120;animation:bladeSweep 8.6s ease-in-out infinite 1s}
.bladeSpark2{stroke-dasharray:22 120;animation:bladeSweep2 8.6s ease-in-out infinite 2s}
.bottomCrystal{animation:crystalPulse 5s ease-in-out infinite}
.shard{animation:shardFloat 6.8s ease-in-out infinite}
@keyframes auraPulse{0%,100%{opacity:.18}50%{opacity:.52}}
@keyframes ringPulse{0%,100%{opacity:.74}50%{opacity:1}}
@keyframes crackSpark{0%,72%,100%{stroke-dashoffset:0;opacity:.15}78%{stroke-dashoffset:-48;opacity:1}86%{stroke-dashoffset:-94;opacity:.25}}
@keyframes fissureRun{0%,70%,100%{stroke-dashoffset:0;opacity:.2}80%{stroke-dashoffset:-55;opacity:1}}
@keyframes bladeSweep{0%,70%,100%{stroke-dashoffset:0;opacity:.1}80%{stroke-dashoffset:-65;opacity:1}90%{stroke-dashoffset:-130;opacity:.1}}
@keyframes bladeSweep2{0%,70%,100%{stroke-dashoffset:0;opacity:.1}80%{stroke-dashoffset:-65;opacity:1}90%{stroke-dashoffset:-130;opacity:.1}}
@keyframes crystalPulse{0%,100%{filter:drop-shadow(0 0 2px rgba(115,194,255,.2))}50%{filter:drop-shadow(0 0 10px rgba(115,194,255,.85))}}
@keyframes shardFloat{0%,100%{opacity:.4}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.aura,.energyRing,.crack,.fissure,.bladeSpark,.bladeSpark2,.bottomCrystal,.shard{animation:none!important}}

</style>
<circle cx="256" cy="256" r="224" fill="url(#violetAura)" opacity=".46" class="aura"/>
<circle cx="256" cy="256" r="184" fill="none" stroke="url(#prestigeBone)" stroke-width="22" opacity="1"/>
<circle cx="256" cy="256" r="163" fill="none" stroke="url(#cyanViolet)" stroke-width="7" opacity="0.92" class="energyRing"/>
<circle cx="256" cy="256" r="149" fill="none" stroke="#121423" stroke-width="3.5" opacity="0.85" stroke-dasharray="18 10 36 12"/>


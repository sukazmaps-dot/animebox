<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  fill="none"
  aria-hidden="true"
  focusable="false">

<defs>
  <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D9DCE9"/>
    <stop offset="12%" stop-color="#666B82"/>
    <stop offset="32%" stop-color="#171823"/>
    <stop offset="55%" stop-color="#07080D"/>
    <stop offset="77%" stop-color="#262839"/>
    <stop offset="100%" stop-color="#B8BCCB"/>
  </linearGradient>

  <linearGradient id="violetMetal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F0D8FF"/>
    <stop offset="18%" stop-color="#A85AFF"/>
    <stop offset="48%" stop-color="#5B2AD7"/>
    <stop offset="74%" stop-color="#24113D"/>
    <stop offset="100%" stop-color="#D768FF"/>
  </linearGradient>

  <linearGradient id="crimsonGem" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFD6E0"/>
    <stop offset="14%" stop-color="#F04C72"/>
    <stop offset="44%" stop-color="#A80F34"/>
    <stop offset="75%" stop-color="#4E0717"/>
    <stop offset="100%" stop-color="#E51F52"/>
  </linearGradient>

  <linearGradient id="fireGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#7A101A"/>
    <stop offset="25%" stop-color="#D52A1C"/>
    <stop offset="51%" stop-color="#FF641F"/>
    <stop offset="73%" stop-color="#FFB52D"/>
    <stop offset="91%" stop-color="#FFE772"/>
    <stop offset="100%" stop-color="#FFF2B8"/>
  </linearGradient>

  <linearGradient id="redBlack" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FF5367"/>
    <stop offset="28%" stop-color="#C91331"/>
    <stop offset="58%" stop-color="#460811"/>
    <stop offset="100%" stop-color="#08080C"/>
  </linearGradient>

  <linearGradient id="prestigeBone" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFF7E8"/>
    <stop offset="28%" stop-color="#E5D7C2"/>
    <stop offset="54%" stop-color="#A99275"/>
    <stop offset="78%" stop-color="#5E5043"/>
    <stop offset="100%" stop-color="#EEE3D2"/>
  </linearGradient>

  <linearGradient id="cyanViolet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#65E8FF"/>
    <stop offset="33%" stop-color="#3E8BFF"/>
    <stop offset="63%" stop-color="#6A49FF"/>
    <stop offset="100%" stop-color="#BD5CFF"/>
  </linearGradient>

  <radialGradient id="violetAura" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#8A52FF" stop-opacity=".34"/>
    <stop offset="60%" stop-color="#6729C9" stop-opacity=".14"/>
    <stop offset="100%" stop-color="#421A8A" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="redAura" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FF385D" stop-opacity=".32"/>
    <stop offset="62%" stop-color="#A40E2B" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#5C0617" stop-opacity="0"/>
  </radialGradient>

  <filter id="glow4" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow8" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<style>

.aura{animation:auraPulse 5.8s ease-in-out infinite}
.innerFrame{filter:url(#glow4);animation:framePulse 5s ease-in-out infinite}
.glyphMotion{transform-box:fill-box;transform-origin:center}
.g1 .glyphMotion,.g5 .glyphMotion{animation:menaceA 4.6s ease-in-out infinite}
.g2 .glyphMotion,.g6 .glyphMotion{animation:menaceB 5.2s ease-in-out infinite .4s}
.g3 .glyphMotion,.g7 .glyphMotion{animation:menaceC 4.9s ease-in-out infinite .8s}
.g4 .glyphMotion,.g8 .glyphMotion{animation:menaceA 5.5s ease-in-out infinite 1.1s}
.wisp{filter:url(#glow8);animation:wispFloat 6s ease-in-out infinite}
.burst{animation:burstPulse 3.8s ease-in-out infinite}
@keyframes auraPulse{0%,100%{opacity:.16}50%{opacity:.48}}
@keyframes framePulse{0%,100%{opacity:.78}50%{opacity:1}}
@keyframes menaceA{0%,100%{transform:translate(0,0) scale(.96)}50%{transform:translate(3px,-6px) scale(1.08)}}
@keyframes menaceB{0%,100%{transform:translate(0,0) scale(.94)}50%{transform:translate(-4px,5px) scale(1.06)}}
@keyframes menaceC{0%,100%{transform:translate(0,0) scale(.97)}50%{transform:translate(5px,2px) scale(1.09)}}
@keyframes wispFloat{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes burstPulse{0%,100%{opacity:.25}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.aura,.innerFrame,.glyphMotion,.wisp,.burst{animation:none!important}}

</style>

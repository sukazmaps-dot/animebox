<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  fill="none"
  aria-hidden="true"
  focusable="false">

<defs>
  <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D9DCE9"/>
    <stop offset="12%" stop-color="#666B82"/>
    <stop offset="32%" stop-color="#171823"/>
    <stop offset="55%" stop-color="#07080D"/>
    <stop offset="77%" stop-color="#262839"/>
    <stop offset="100%" stop-color="#B8BCCB"/>
  </linearGradient>

  <linearGradient id="violetMetal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F0D8FF"/>
    <stop offset="18%" stop-color="#A85AFF"/>
    <stop offset="48%" stop-color="#5B2AD7"/>
    <stop offset="74%" stop-color="#24113D"/>
    <stop offset="100%" stop-color="#D768FF"/>
  </linearGradient>

  <linearGradient id="crimsonGem" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFD6E0"/>
    <stop offset="14%" stop-color="#F04C72"/>
    <stop offset="44%" stop-color="#A80F34"/>
    <stop offset="75%" stop-color="#4E0717"/>
    <stop offset="100%" stop-color="#E51F52"/>
  </linearGradient>

  <linearGradient id="fireGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#7A101A"/>
    <stop offset="25%" stop-color="#D52A1C"/>
    <stop offset="51%" stop-color="#FF641F"/>
    <stop offset="73%" stop-color="#FFB52D"/>
    <stop offset="91%" stop-color="#FFE772"/>
    <stop offset="100%" stop-color="#FFF2B8"/>
  </linearGradient>

  <linearGradient id="redBlack" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FF5367"/>
    <stop offset="28%" stop-color="#C91331"/>
    <stop offset="58%" stop-color="#460811"/>
    <stop offset="100%" stop-color="#08080C"/>
  </linearGradient>

  <linearGradient id="prestigeBone" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFF7E8"/>
    <stop offset="28%" stop-color="#E5D7C2"/>
    <stop offset="54%" stop-color="#A99275"/>
    <stop offset="78%" stop-color="#5E5043"/>
    <stop offset="100%" stop-color="#EEE3D2"/>
  </linearGradient>

  <linearGradient id="cyanViolet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#65E8FF"/>
    <stop offset="33%" stop-color="#3E8BFF"/>
    <stop offset="63%" stop-color="#6A49FF"/>
    <stop offset="100%" stop-color="#BD5CFF"/>
  </linearGradient>

  <radialGradient id="violetAura" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#8A52FF" stop-opacity=".34"/>
    <stop offset="60%" stop-color="#6729C9" stop-opacity=".14"/>
    <stop offset="100%" stop-color="#421A8A" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="redAura" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FF385D" stop-opacity=".32"/>
    <stop offset="62%" stop-color="#A40E2B" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#5C0617" stop-opacity="0"/>
  </radialGradient>

  <filter id="glow4" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow8" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<style>

.aura{animation:auraPulse 6.4s ease-in-out infinite}
.sigilBlade,.eyeCore{transform-box:view-box;transform-origin:256px 256px;animation:sigilSpin 22s linear infinite}
.redRing{filter:url(#glow4);animation:ringPulse 4.6s ease-in-out infinite}
.spectral{filter:url(#glow8);animation:spectralBreath 5.5s ease-in-out infinite}
@keyframes auraPulse{0%,100%{opacity:.12}50%{opacity:.44}}
@keyframes sigilSpin{to{transform:rotate(360deg)}}
@keyframes ringPulse{0%,100%{opacity:.78}50%{opacity:1}}
@keyframes spectralBreath{0%,100%{opacity:.35}50%{opacity:.86}}
@media(hover:hover){svg:hover .sigilBlade,svg:hover .eyeCore{animation-duration:13s}}
@media(prefers-reduced-motion:reduce){.aura,.sigilBlade,.eyeCore,.redRing,.spectral{animation:none!important}}

</style>
<circle cx="256" cy="256" r="220" fill="url(#violetAura)" opacity=".36" class="aura"/>
<circle cx="256" cy="256" r="182" fill="none" stroke="#07080B" stroke-width="22" opacity="1"/>
<circle cx="256" cy="256" r="164" fill="none" stroke="url(#redBlack)" stroke-width="9" opacity="0.98" class="redRing"/>
<circle cx="256" cy="256" r="150" fill="none" stroke="#1F060B" stroke-width="3.5" opacity="0.9" stroke-dasharray="22 11"/>
<path d="M256 66 C306 72 339 95 365 126 C329 116 300 122 281 145 C277 113 269 87 256 66Z" fill="url(#redBlack)" stroke="#FF5269" stroke-width="2.2" opacity="1" class="sigilBlade" />
<path d="M416 348 C385 390 350 413 309 423 C328 391 328 360 311 334 C344 344 379 351 416 348Z" fill="url(#redBlack)" stroke="#FF5269" stroke-width="2.2" opacity="1" class="sigilBlade" />
<path d="M96 348 C127 390 162 413 203 423 C184 391 184 360 201 334 C168 344 133 351 96 348Z" fill="url(#redBlack)" stroke="#FF5269" stroke-width="2.2" opacity="1" class="sigilBlade" />

<g class="eyeCore">
  <circle cx="256" cy="105" r="19" fill="#D81733" stroke="#FF5E73" stroke-width="2"/>
  <circle cx="256" cy="105" r="8" fill="#08080B"/>
  <path d="M239 106 Q256 91 273 106 Q256 118 239 106Z"
        fill="none" stroke="#35050B" stroke-width="3"/>
</g>


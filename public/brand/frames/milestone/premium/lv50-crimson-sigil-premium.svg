  <circle cx="352" cy="357" r="19" fill="#D81733" stroke="#FF5E73" stroke-width="2"/>
  <circle cx="352" cy="357" r="8" fill="#08080B"/>
  <path d="M335 358 Q352 343 369 358 Q352 370 335 358Z"
        fill="none" stroke="#35050B" stroke-width="3"/>
</g>

<g class="eyeCore">
  <circle cx="160" cy="357" r="19" fill="#D81733" stroke="#FF5E73" stroke-width="2"/>
  <circle cx="160" cy="357" r="8" fill="#08080B"/>
  <path d="M143 358 Q160 343 177 358 Q160 370 143 358Z"
        fill="none" stroke="#35050B" stroke-width="3"/>
</g>
<path d="M256 38 272 67 256 94 240 67Z" fill="#11121A" stroke="#6F3C7C" stroke-width="2" opacity="1" />
<path d="M256 474 272 445 256 418 240 445Z" fill="#11121A" stroke="#6F3C7C" stroke-width="2" opacity="1" />
<path d="M38 256 67 240 94 256 67 272Z" fill="#11121A" stroke="#6F3C7C" stroke-width="2" opacity="1" />
<path d="M474 256 445 240 418 256 445 272Z" fill="#11121A" stroke="#6F3C7C" stroke-width="2" opacity="1" />
<path d="M92 151 C75 115 91 82 128 64 C116 91 126 116 151 129 C125 128 105 136 92 151Z" fill="#5E2FC4" stroke="#A36CFF" stroke-width="1.8" opacity="0.75" class="spectral" />
<path d="M420 361 C438 396 420 431 383 447 C397 420 387 396 362 382 C388 383 407 375 420 361Z" fill="#5E2FC4" stroke="#A36CFF" stroke-width="1.8" opacity="0.75" class="spectral" />
<path d="M408 142 C430 112 426 84 396 59 C401 89 389 110 364 121 C385 124 400 132 408 142Z" fill="#5E2FC4" stroke="#A36CFF" stroke-width="1.8" opacity="0.68" class="spectral" />
</svg>
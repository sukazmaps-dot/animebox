<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="level-legend">
  <defs>
    <linearGradient id="g" x1="16" y1="16" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2BC49"/>
      <stop offset=".52" stop-color="#FFE9A3"/>
      <stop offset="1" stop-color="#F2BC49"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ring{fill:none;stroke:url(#g);stroke-linecap:round;stroke-linejoin:round}
      .outer{stroke-width:3.8}
      .inner{stroke-width:1.2;opacity:.42}
      .dash{stroke-width:1.5;opacity:.55;stroke-dasharray:8 6}
      .motif{fill:none;stroke:url(#g);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
      .core{fill:url(#g);filter:url(#glow)}
      .spark{fill:#FFE9A3;filter:url(#glow);opacity:.45}
      
    .orbit{animation:spin 10s linear infinite;transform-origin:60px 60px}
    .dash{animation:dash 5s linear infinite}
    .motif{animation:pulse 2.8s ease-in-out infinite;transform-origin:60px 60px}
    .spark{animation:spark 2.4s ease-in-out infinite;transform-origin:center}
    .spark.s2{animation-delay:.8s}.spark.s3{animation-delay:1.45s}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes dash{to{stroke-dashoffset:-48}}
    @keyframes pulse{0%,100%{opacity:.72;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
    @keyframes spark{0%,100%{opacity:.1;transform:scale(.55)}45%{opacity:1;transform:scale(1.25)}}
    @media (prefers-reduced-motion: reduce){.orbit,.dash,.motif,.spark{animation:none!important}}
  
    </style>
  </defs>
  <g class="orbit">
    <circle class="ring outer" cx="60" cy="60" r="54"/>
    <circle class="ring inner" cx="60" cy="60" r="47"/>
    <circle class="ring dash" cx="60" cy="60" r="50"/>
  </g>
  <g filter="url(#glow)"><path class="motif" d="M36 72 43 38l17 13 17-13 7 34H36Z"/><path class="core" d="m60 24 4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1 4-8Z"/></g>
  <circle class="spark s1" cx="16" cy="54" r="2.3"/>
  <circle class="spark s2" cx="101" cy="33" r="1.8"/>
  <circle class="spark s3" cx="92" cy="91" r="2.1"/>
</svg>
name: AnimeBox Preview Identity

on:
  push:
    branches: ['preview-*']

jobs:
  verify-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout preview trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify empty preview trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse HEAD^^{tree})"
          git diff --exit-code HEAD^ HEAD
          echo "Preview trigger preserved the release tree."

name: Patch 6.1 Check

on:
  push:
    branches:
      - patch-6-1-tma-mobile-ux-hotfix
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint changed code
        run: >-
          npx eslint
          components/AuthStateProvider.tsx
          components/TelegramMiniAppBridge.tsx
          components/TelegramAuthButton.tsx
          components/Navbar.tsx
          components/MobileAccountNav.tsx
          app/layout.tsx
      - name: Production build
        run: npm run build

name: AnimeBox Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: animebox-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Targeted lint
        run: >-
          npx eslint
          lib/watch-party.ts
          lib/watch-party-rooms-server.ts
          lib/watch-party-network-client.ts
          lib/watch-party-relay-client.ts
          app/api/watch-party/rooms/route.ts
          app/api/watch-party/rooms/[roomId]/heartbeat/route.ts
          app/api/watch-party/rooms/[roomId]/end/route.ts
          app/api/watch-party/rooms/[roomId]/report/route.ts
          app/api/watch-party/rooms/[roomId]/transfer/route.ts
          app/api/watch-party/identities/route.ts
          app/api/watch-party/health/route.ts
          components/watch-party/WatchTogetherHub.tsx
          components/watch-party/WatchPartyPanel.tsx
          components/AnimePlayer.tsx
          lib/seo-episodes.ts
          app/episodes/sitemap.ts
          app/robots.ts
          lib/profile-media-safety-server.ts
          lib/profile-media-review-server.ts
          lib/profile-media-auto-review-server.ts
          app/api/cron/profile-media-moderation/route.ts
          app/api/profile/editor/route.ts
          app/api/admin/community/media/route.ts
          app/admin/moderation/page.tsx
          lib/profile-media-health-server.ts
          components/TelegramPromoCard.tsx
          components/TelegramSubscriptionGate.tsx
          components/watch-party/WatchTogetherHub.tsx
          lib/telegram-links.ts
          lib/product-events-client.ts
          lib/product-events-server.ts
          app/api/telegram/subscription-check/route.ts

      - name: Production build
        run: npm run build

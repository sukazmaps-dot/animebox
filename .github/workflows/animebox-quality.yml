      - name: Retention regression checks
        run: node tests/retention.cjs

      - name: Mobile home and runtime auth regression checks
        run: node tests/home-rail-session.cjs && node tests/public-auth-config.cjs

      - name: Browser origin guard regression checks
        run: node tests/browser-request-origin.cjs

      - name: Railway analytics origin regression checks
        run: npm run home-visual-analytics:check

      - name: Auth callback and access operations regression checks
        run: npm run auth-access:check

      - name: Media relay, owner Telegram diagnostics and sitemap regression checks
        run: npm run media-origin-recovery:check && python3 tests/seo-sitemap-smoke-test.py

      - name: Patch 31.1 integrated home visual, mobile hero and media recovery
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
        run: node scripts/patch30-0-home-browser-smoke.cjs

      - name: Profile media reading, compression and crop dialog regression
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
        run: npm run patch30-9:check && npm run profile-media:browser

      - name: Production build
        run: NODE_ENV=production npm run build

      - name: Guest settings hydration regression
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
        run: node scripts/settings-guest-smoke.cjs

      - name: Mobile auth modal hydration and visual viewport lifecycle
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
        run: npm run auth-modal:browser

      - name: Patch 29.14 actual guest routes and dynamic source-equivalent geometry
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
        run: npm run route-layout:check && npm run route-layout:browser

      - name: Mobile hero pagination geometry and accessible positions
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
        run: npm run hero-pagination:browser

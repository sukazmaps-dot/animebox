name: AnimeBox Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: animebox-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Targeted lint
        run: >-
          npx eslint
          lib/watch-party.ts
          lib/watch-party-rooms-server.ts
          lib/watch-party-network-client.ts
          lib/watch-party-relay-client.ts
          app/api/watch-party/rooms/route.ts
          app/api/watch-party/rooms/[roomId]/heartbeat/route.ts
          app/api/watch-party/rooms/[roomId]/end/route.ts
          app/api/watch-party/rooms/[roomId]/report/route.ts
          app/api/watch-party/rooms/[roomId]/transfer/route.ts
          app/api/watch-party/identities/route.ts
          app/api/watch-party/health/route.ts
          components/watch-party/WatchTogetherHub.tsx
          components/watch-party/WatchPartyPanel.tsx
          components/AnimePlayer.tsx
          components/HomeHeroCarousel.tsx
          lib/seo-episodes.ts
          lib/seo-episode-index.ts
          lib/episode-seo.ts
          lib/uuid.ts
          app/anime/[slug]/episode/[episode]/page.tsx
          app/api/anime/[slug]/episode-availability/route.ts
          components/Navbar.tsx
          components/AuthUserButton.tsx
          components/SidebarMembership.tsx
          components/SocialNotificationBadge.tsx
          components/social/SocialPresenceHeartbeat.tsx
          components/analytics/ProductAnalyticsTracker.tsx
          components/DeferredMount.tsx
          components/DeferredAppEnhancements.tsx
          components/OfflineCacheBridge.tsx
          components/home/HomePageShell.tsx
          components/home/HomeFeedRuntimeProvider.tsx
          components/home/useHomeRecommendationRuntime.ts
          components/home/HomeScheduleRuntimeProvider.tsx
          components/home/HomeHeroSection.tsx
          components/home/HomeDiscoverySection.tsx
          components/home/HomeCatalogSections.tsx
          components/home/HomeScheduleSection.tsx
          components/home/HomePersonalRetentionSections.tsx
          components/home/HomeDeferredCommunity.tsx
          components/home/HomeRightRail.tsx
          components/AnimeImage.tsx
          components/AnimeCard.tsx
          components/HomeContinueWatching.tsx
          components/HomeRetentionHub.tsx
          components/ScheduleItem.tsx

name: AnimeBox Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: animebox-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: CSS ownership inventory and regression
        run: npm run css:inventory:check

      - name: Upload CSS inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: css-inventory
          path: artifacts/css-inventory/
          if-no-files-found: warn
          retention-days: 14

      - name: Hero CSS consolidation equivalence
        run: npm run hero-css:check

      - name: Navigation cascade ownership
        run: npm run nav-css:check

      - name: Franchise CSS Module ownership
        run: npm run franchise-css:check

      - name: Franchise copy CSS Module ownership
        run: npm run franchise-copy-css:check

      - name: Railway 31.19 cache, image memory and cancellation regression
        run: npm run railway-cost:check

      - name: Railway cost optimization lint
        run: npx eslint lib/public-result-cache.ts lib/bounded-work.ts lib/image-upstream-server.ts app/api/image/route.ts app/api/jikan/anime/route.ts

      - name: Poster sources, bounded relay compression and no-storage defaults
        run: npm run poster-reliability:check

      - name: Patch 32.1.1 recommended poster consumers and presence lint
        run: npx eslint app/api/recommendations/route.ts app/api/discovery/route.ts components/RelatedAnime.tsx components/social/SocialPresenceHeartbeat.tsx lib/social-presence-retry.ts

      - name: Hotfix 31.15 independent API protection and Telegram outage tests
        run: npm run hotfix31-15:check

      - name: Hotfix 31.16 Supabase outage regression
        run: npm run hotfix31-16:check

      - name: Profile editor 31.18 inspector invariants
        run: npm run profile-inspector:check

      - name: Install Chromium for layout regression
        run: |
          npm install --prefix "$RUNNER_TEMP/animebox-browser" --no-audit --no-fund --save-exact playwright@1.62.1 esbuild@0.28.2
          "$RUNNER_TEMP/animebox-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Compact watch controls interaction and iframe continuity
        env:
          ESBUILD_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/esbuild
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
        run: node scripts/watch-compact-controls-browser-smoke.cjs

      - name: Compact watch visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-compact-visual-review
          path: artifacts/watch-compact/
          if-no-files-found: ignore

      - name: Home 32 production shell and responsive interaction matrix
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
          HOME32_SCREENSHOT_DIR: artifacts/home32
        run: |
          npm run home32:check
          npx eslint app/page.tsx components/home/HomePageShell.tsx components/home/HomeHeroSection.tsx components/home/HomeDiscoverySection.tsx components/home/HomeWatchTogetherSection.tsx components/HomeHeroCarousel.tsx components/HomeHeroPagination.tsx components/HomeMoodPicker.tsx
          npm run home32:browser

      - name: Home 32 visual review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home32-visual-review
          path: artifacts/home32
          if-no-files-found: ignore

      - name: Home hero artwork recovery and quality
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
        run: npm run patch31-4:check && npm run patch31-4:browser

      - name: Cinematic anime browser layout regression
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
        run: npm run anime-layout:check

      - name: Phase 3D before-after browser and screenshot parity
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 280
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
          FRANCHISE_PARITY_SCREENSHOT_DIR: artifacts/franchise-phase3d
        run: |
          git fetch --no-tags --depth=1 origin 0c557678cd2a623e37f141c64538fba63bdf38bb
          node scripts/franchise-copy-css-parity.mjs

      - name: Upload franchise Phase 3D before-after screenshot pairs
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 280
        uses: actions/upload-artifact@v4
        with:
          name: franchise-phase3d-parity
          path: artifacts/franchise-phase3d/
          if-no-files-found: warn
          retention-days: 14

      - name: Chat frame browser layout regression
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
        run: node scripts/chat-frame-layout-smoke.cjs

      - name: Shared palette and Premium browser regression
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
        run: npm run palette:check && node scripts/site-palette-smoke.cjs

      - name: Patch 29.13 CSS cascade ownership and responsive browser regression
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
        run: npm run css-cascade:check && npm run css-cascade:browser

      - name: Player dropdown portal and viewport placement regression
        env:
          ESBUILD_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/esbuild
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
        run: |
          npm run player-dropdown:check
          npx eslint components/AnimePlayer.tsx components/PlayerDropdown.tsx lib/player-dropdown-position.ts
          node scripts/player-dropdown-portal-browser-smoke.cjs

      - name: Episode mobile player controls at 360px
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
        run: npm run player-hotfix:browser && npm run mobile-player-shell:browser

      - name: Fullscreen exit overlay idle and iframe identity regression
        env:
          ESBUILD_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/esbuild
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
        run: npm run player-fullscreen:browser

      - name: Profile editor responsive workspace and draft recovery
        env:
          ESBUILD_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/esbuild
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
          PROFILE_EDITOR_SCREENSHOT_DIR: artifacts/profile-editor
        run: node scripts/profile-editor-dock-smoke.cjs && npm run editor-workspace:check && npm run editor-workspace:browser && npm run editor-unified:browser

      - name: Profile editor 31.14 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-editor-31-14
          path: artifacts/profile-editor/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Patch 30.7 intent-based card prefetch
        run: npm run patch30-7:check

      - name: Release consolidation invariants
        run: npm run release-consolidation:check

      - name: Patch 30.0 streaming home and media regression
        run: npm run patch30-0:check && npm run home-hydration:check && npm run image-delivery:check && npm run mobile-performance:check

      - name: Schedule media and search regression checks
        run: npm run schedule-media:check

      - name: Schedule tooltip interaction and idle listener regression
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/animebox-browser/node_modules/playwright
        run: npm run schedule-tooltip:browser

      - name: SEO cron recovery and sitemap regression check
        run: npm run seo-cron-recovery:check

      - name: SEO AniList source pagination depth check
        run: npm run seo-anilist-depth:check

      - name: Durable leaderboard SQL regression
        run: npm run league-reliability:check

      - name: Patch 30.3 metadata normalization and episode display
        run: npm run patch30-3:check

      - name: Mobile player overlay and ending timing regression
        run: npm run player-hotfix:check

      - name: Patch 30.6 premium page geometry regression
        run: npm run patch30-6:check

      - name: Patch 30.4 canonical AniList metadata consistency
        run: npm run patch30-4:check

      - name: SEO catalog integrity and canonical safety
        run: npm run patch30-5:check

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Targeted lint
        run: >-
          npx eslint
          lib/watch-party.ts
          lib/watch-party-rooms-server.ts
          lib/watch-party-network-client.ts
          lib/watch-party-relay-client.ts
          app/api/watch-party/rooms/route.ts
          app/api/watch-party/rooms/[roomId]/heartbeat/route.ts
          app/api/watch-party/rooms/[roomId]/end/route.ts
          app/api/watch-party/rooms/[roomId]/report/route.ts
          app/api/watch-party/rooms/[roomId]/transfer/route.ts
          app/api/watch-party/rooms/[roomId]/presence/route.ts
          app/api/watch-party/rooms/[roomId]/claim-host/route.ts
          app/api/watch-party/rooms/resolve/route.ts
          app/api/watch-party/identities/route.ts
          app/api/watch-party/health/route.ts
          components/watch-party/WatchTogetherHub.tsx
          components/watch-party/WatchPartyPanel.tsx
          components/AnimePlayer.tsx
          components/AnimeEpisodePage.tsx
          components/DirectVideoPlayer.tsx
          components/useWatchSession.ts
          app/api/watch/route.ts
          lib/watch-server.ts
          lib/watch-trust.ts
          lib/watch-trust-server.ts
          lib/watch-trust-admin-server.ts
          app/api/admin/watch-trust/route.ts
          lib/trusted-progression-pipeline-server.ts
          lib/trusted-progression-metrics-server.ts
          lib/progression-integrity-server.ts

      - name: Retention regression checks
        run: node tests/retention.cjs

      - name: Production build
        run: npm run build


  package-premium-identity-overlay:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Build Patch 18.9 cumulative overlay
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf patch-overlay animebox-patch-18-9-premium-profile-identity.zip
          mkdir -p patch-overlay

          while IFS= read -r file; do
            [ "$file" = ".github/workflows/animebox-quality.yml" ] && continue
            [ -f "$file" ] || continue
            mkdir -p "patch-overlay/$(dirname "$file")"
            cp "$file" "patch-overlay/$file"
          done < <(git diff --name-only --diff-filter=ACMRT origin/main...HEAD)

          cat > patch-overlay/PATCH_INFO.txt <<'EOF'
          AnimeBox Patch 18.9 — Premium Profile Identity / Atmosphere

          Cumulative overlay поверх актуального main.

          Главное:
          - Cinematic Premium Hero
          - Atmosphere Engine: None / Aurora / Embers / Sakura / Stardust
          - Motion Mode: Off / Soft / Live
          - Entrance: None / Fade / Bloom / Manga Cut / Glitch
          - Nickname: None / Gradient / Shimmer / Glow
          - Hero styles: Cinematic / Spotlight / Clean
          - Surface styles: Glass / Deep / Ink
          - Adaptive palette from avatar/banner
          - Extra presets: Crimson Oath / Ocean Glass / Golden Hour
          - Live GIF / Animated WebP crop preview
          - Premium avatar 8 MB policy + static WebP fallback
          - original milestone frames v3.1
          - milestone safe zones: 52 / 54 / 46 / 52 / 46%
          - one active cosmetic frame
          - Premium avatar aura without second-frame stacking

          DB migrations included:
          - 20260926221958_premium_profile_identity_v1.sql
          - 20260926223142_premium_profile_identity_theme_presets_v2.sql
          - 20260927001500_progression_frame_selection_v1.sql

          Проверка:
          npm run patch18-8:check
          npx tsc --noEmit
          npm run build
          EOF

          test "$(find patch-overlay -type f | wc -l)" -ge 50
          test "$(find patch-overlay/public/brand/frames/milestone -type f -name '*.svg' | wc -l)" -eq 10
          test -f patch-overlay/components/premium/PremiumProfileAtmosphere.tsx
          test -f patch-overlay/lib/adaptive-profile-theme-client.ts
          test -f patch-overlay/supabase/migrations/20260926221958_premium_profile_identity_v1.sql
          test -f patch-overlay/supabase/migrations/20260926223142_premium_profile_identity_theme_presets_v2.sql
          grep -q "'milestone-lv50-crimson-sigil': 0.46" patch-overlay/lib/progression.ts
          grep -q "PREMIUM_ATMOSPHERE_EFFECTS" patch-overlay/lib/premium-studio.ts
          grep -q "deriveAdaptiveProfilePalette" patch-overlay/components/premium/PremiumStudioClient.tsx
          grep -q "GIF и Animated WebP продолжают двигаться" patch-overlay/components/premium/PremiumMediaCropEditor.tsx

          cd patch-overlay
          zip -r ../animebox-patch-18-9-premium-profile-identity.zip .
          cd ..

      - name: Upload Patch 18.9 overlay
        uses: actions/upload-artifact@v4
        with:
          name: animebox-patch-18-9-premium-profile-identity
          path: animebox-patch-18-9-premium-profile-identity.zip
          if-no-files-found: error
          retention-days: 3

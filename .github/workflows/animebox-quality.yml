name: AnimeBox Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: animebox-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Targeted lint
        run: >-
          npx eslint
          lib/watch-party.ts
          lib/watch-party-rooms-server.ts
          lib/watch-party-network-client.ts
          lib/watch-party-relay-client.ts
          app/api/watch-party/rooms/route.ts
          app/api/watch-party/rooms/[roomId]/heartbeat/route.ts
          app/api/watch-party/rooms/[roomId]/end/route.ts
          app/api/watch-party/rooms/[roomId]/report/route.ts
          app/api/watch-party/rooms/[roomId]/transfer/route.ts
          app/api/watch-party/identities/route.ts
          app/api/watch-party/health/route.ts
          components/watch-party/WatchTogetherHub.tsx
          components/watch-party/WatchPartyPanel.tsx
          components/AnimePlayer.tsx
          components/HomeHeroCarousel.tsx
          lib/seo-episodes.ts
          lib/seo-episode-index.ts
          lib/episode-seo.ts
          lib/uuid.ts
          app/anime/[slug]/episode/[episode]/page.tsx
          app/api/anime/[slug]/episode-availability/route.ts
          components/AnimeEpisodePage.tsx
          app/episodes/sitemap.ts
          app/robots.ts
          lib/profile-media-publish-server.ts
          app/api/profile/editor/route.ts
          components/profile/ProfileEditorClient.tsx
          components/premium/PremiumStudioClient.tsx
          app/api/admin/community/media/route.ts
          app/admin/moderation/page.tsx
          components/TelegramPromoCard.tsx
          components/TelegramSubscriptionGate.tsx
          lib/telegram-links.ts
          lib/product-event-names.ts
          lib/product-events-client.ts
          lib/product-events-server.ts
          app/api/telegram/subscription-check/route.ts
          components/TelegramWelcomePromo.tsx
          components/MobileAccountNav.tsx
          app/profile/[id]/page.tsx
          app/friends/page.tsx
          components/SocialNotificationBadge.tsx
          components/SocialNotificationsClient.tsx
          components/friends/WatchPartyFriendInvite.tsx
          components/friends/FriendsPageClient.tsx
          components/friends/FriendActionButton.tsx
          app/api/social/notifications/route.ts
          app/api/friends/invite/route.ts
          app/api/friends/route.ts
          lib/social-notifications-server.ts
          lib/friends-server.ts
          components/TelegramMiniAppBridge.tsx
          components/AnimeComments.tsx
          components/EpisodeComments.tsx
          lib/profile-live-sync.ts
          components/GoogleAuthButton.tsx
          components/TelegramAuthButton.tsx
          components/AuthModalProvider.tsx
          app/register/page.tsx
          lib/telegram-growth-client.ts

      - name: Production build
        run: npm run build

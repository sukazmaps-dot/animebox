name: Patch 6 Check

on:
  push:
    branches:
      - patch-6-retention-personalization-v2
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint Patch 6
        run: >-
          npx eslint
          components/HomeContinueWatching.tsx
          components/HomePageClient.tsx
          components/NotificationSettingsClient.tsx
          components/admin/ProductAnalyticsDashboard.tsx
          lib/product-events-client.ts
          lib/product-events-server.ts
          lib/watch-server.ts
          lib/taste-graph.ts
          lib/recommendations.ts
          lib/notifications-server.ts
          lib/product-analytics-server.ts
          app/api/recommendations/taste/route.ts
          app/api/notifications/settings/route.ts
          app/api/notifications/inbox/route.ts
      - name: Production build
        run: npm run build

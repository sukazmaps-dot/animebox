name: Patch 24.1 Mood Intent Validation

on:
  push:
    branches:
      - patch-24-1-mood-intent-engine

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run patch24-1:check
      - run: npm run patch23:check
      - run: npm run patch22:home-check
      - run: npm run recommendation-engine:check
      - run: npx tsc --noEmit

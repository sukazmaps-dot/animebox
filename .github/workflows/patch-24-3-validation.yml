name: Patch 24.3 Search Observability Validation

on:
  push:
    branches:
      - patch-24-3-search-observability

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run patch24-3:check
      - run: npm run patch24-2:check
      - run: npm run search-intelligence:check
      - run: npm run security:check
      - run: npx tsc --noEmit
      - run: npm run build
